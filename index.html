<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>FMAbhaya Suite · Sinhala Unicode ⇄ FMAbhaya</title>
  <script>
    // Apply saved theme before paint (no flash)
    try {
      const t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <header class="header">
    <div class="container header__row">
      <div class="brand">
        <div>
          <h1 class="brand__title">FMAbhaya Suite</h1>
        </div>
      </div>

    </div>
  </header>

  <main class="container main">
    <div class="mode" role="group" aria-label="Conversion direction">
      <div class="seg">
        <button id="mode-uni" class="seg__btn" type="button" aria-pressed="true">Unicode → FMAbhaya</button>
        <button id="mode-fm" class="seg__btn" type="button" aria-pressed="false">FMAbhaya → Unicode</button>
      </div>
      <span id="direction-status" class="mode__status" aria-live="polite">Unicode → FMAbhaya</span>
      <button id="swap-btn" class="icon-btn" type="button" aria-label="Swap direction (Ctrl/⌘ + K)" title="Swap (Ctrl/⌘ + K)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>
      </button>
      <button id="theme-btn" class="icon-btn" type="button" aria-label="Toggle theme" title="Toggle theme">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>

    <section class="panes">
      <div class="pane">
        <div class="pane__head">
          <label id="src-title" for="src" class="pane__title">Unicode input</label>
          <button id="paste-btn" class="btn btn--ghost" type="button">Paste</button>
        </div>
        <textarea id="src" class="pane__text" spellcheck="false" autocomplete="off" autocapitalize="off"
          placeholder="Type or paste text…"></textarea>
        <div class="pane__foot">
          <button id="clear-btn" class="btn btn--ghost" type="button">Clear</button>
          <span id="src-stats" class="stats">0 characters</span>
        </div>
      </div>

      <div class="pane">
        <div class="pane__head">
          <label id="out-title" for="out" class="pane__title">FMAbhaya output</label>
        </div>
        <textarea id="out" class="pane__text pane__text--out" readonly spellcheck="false"
          placeholder="Converted text appears here…" ></textarea>
        <div class="pane__foot">
          <button id="copy-btn" class="btn btn--primary" type="button">
            <span id="copy-label">Copy</span>
          </button>
          <span id="out-stats" class="stats">0 characters</span>
        </div>
      </div>
    </section>

    <p class="note">
      Output uses legacy ASCII codes. Install the <strong>FM Abhaya</strong> font to see it rendered as Sinhala.
    </p>
  </main>
  <footer class="footer container">
    <p>
      Created by <a href="https://www.drafnet.eu.org/" target="_blank" rel="noopener noreferrer">Nemetlan</a>.
      Inspired by <a href="http://malinthe.com/" target="_blank" rel="noopener noreferrer">Malinthe Samarakoon</a>.
      Originally created by <a href="http://www.ucsc.cmb.ac.lk/ltrl/services/feconverter/" target="_blank" rel="noopener noreferrer">LTRL, University of Colombo School of Computing</a>.
      <a href="http://www.ucsc.cmb.ac.lk/ltrl/services/feconverter/" target="_blank" rel="noopener noreferrer">Other Converter</a>
    </p>
  </footer>
</body>
</html>
